<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Centinela</title>
    <!-- App privada de clientes (con inicio de sesión): no se indexa -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Color de la barra del navegador según el modo del sistema (mismos fondos que la app) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1012" />
    <meta name="color-scheme" content="light dark" />
    <!-- Tema elegido a mano (Claro / Oscuro) antes de pintar, sin parpadeo; archivo propio por la CSP -->
    <script src="/tema-inicial.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Centinela" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <noscript>Necesitás habilitar JavaScript para usar Centinela.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
