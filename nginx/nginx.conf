events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/x-javascript;

  # HTTP — ACME challenge y redirect a HTTPS
  server {
    listen 80;
    server_name clientes.telemet.com.ar;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name clientes.telemet.com.ar;

    ssl_certificate /etc/letsencrypt/live/clientes.telemet.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clientes.telemet.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /var/www/html;
    index index.html;

    location ~* \.(js|css|woff2|woff|ttf|svg|png|jpg|ico)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA: nunca cachear el manifest -- que las actualizaciones lleguen sin que el usuario
    # tenga que limpiar caché a mano
    location = /manifest.json {
      add_header Cache-Control "no-cache";
    }

    # SPA (Expo Router, web.output "single"): cualquier ruta no encontrada cae al index.html,
    # el router del lado del cliente resuelve la pantalla real
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
  }
}
