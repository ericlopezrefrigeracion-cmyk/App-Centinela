# Cabeceras de seguridad comunes (ESTANDARES C2). Se incluye en el server y en CADA location:
# un add_header dentro de un location anula todos los del server.
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# App privada de clientes: no se indexa (ver también robots.txt y la meta robots)
add_header X-Robots-Tag "noindex, nofollow" always;
# Solo scripts propios. Estilos en línea permitidos (React y el HTML de los reportes PDF los usan);
# fuente Inter de Google Fonts; la única API es la de Telemet.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.telemet.com.ar; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
