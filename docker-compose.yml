# Logs de cada contenedor: 10 MB × 3 (ESTANDARES A7; el daemon.json del host lo mismo, desde el próximo reinicio).
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    container_name: nginx
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    logging: *logs
    # La configuración se monta como carpeta (no archivo suelto): así el deploy la actualiza con git y
    # un "nginx -s reload" la toma, sin reiniciar el contenedor.
    command: ["nginx", "-c", "/etc/nginx/centinela/nginx.conf", "-g", "daemon off;"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/centinela:ro
      - ./dist:/var/www/html:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    logging: *logs
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: "/bin/sh -c 'apk add --no-cache docker-cli > /dev/null 2>&1; trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet && docker exec nginx nginx -s reload 2>/dev/null || true; sleep 12h & wait $${!}; done'"

volumes:
  certbot_data:
  certbot_www:
