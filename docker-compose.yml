services:
  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/var/www/html:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: "/bin/sh -c 'apk add --no-cache docker-cli > /dev/null 2>&1; trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet && docker exec nginx nginx -s reload 2>/dev/null || true; sleep 12h & wait $${!}; done'"

volumes:
  certbot_data:
  certbot_www:
