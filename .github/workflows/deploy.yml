name: Deploy Centinela

on:
  push:
    branches: [main]
  # En cada PR (los de Dependabot, por ejemplo) corren las verificaciones y los tests, sin desplegar.
  pull_request:
  # Para volver a desplegar sin cambios (por ejemplo, después de rotar la clave del deploy).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cada rama tiene su grupo; los deploys de main hacen fila y nunca se cancelan a mitad (ESTANDARES B4).
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias de producción (ESTANDARES B8)
        run: npm audit --omit=dev

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build (Vite → dist/)
        run: npm run build

      - name: Actualizar config en el VPS (docker-compose.yml, nginx.conf) y levantar servicios
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # La primera vez servidor.sh instala paquetes (apt en un VPS de 512 MB): margen de sobra.
          command_timeout: 20m
          script: |
            set -e
            cd /opt/centinela
            ANTES=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            # Configuración del servidor (ESTANDARES A1-A9): firewall, fail2ban, SSH, swap, journal, Docker y
            # actualizaciones. Idempotente: solo toca lo que cambió.
            bash deploy/servidor.sh
            # Probar la configuración nueva de nginx antes de usarla; si falla, volver a la anterior (ESTANDARES B6)
            if ! docker compose run --rm --no-deps -T nginx nginx -t -c /etc/nginx/centinela/nginx.conf; then
              echo "✗ nginx -t falló: vuelvo a la configuración anterior"
              git reset --hard "$ANTES"
              exit 1
            fi
            docker compose up -d
            docker exec nginx nginx -s reload
            # Renovación del SSL verificada de verdad una vez por semana (ESTANDARES C1): si el desafío webroot no
            # funciona, el deploy falla ahora y no el día que vence. Si el loop del contenedor certbot está
            # renovando en ese momento ("Another instance"), espera y reintenta.
            MARCA=/var/lib/centinela/ultima-prueba-renovacion
            mkdir -p /var/lib/centinela
            if [ ! -f "$MARCA" ] || [ -n "$(find "$MARCA" -mtime +7)" ]; then
              OK=no
              for _ in 1 2 3 4 5 6; do
                if SALIDA=$(docker compose exec -T certbot certbot renew --dry-run --no-random-sleep-on-renew \
                    --webroot --webroot-path=/var/www/certbot 2>&1); then OK=si; break; fi
                echo "$SALIDA" | grep -q "Another instance" || break
                sleep 15
              done
              if [ "$OK" = si ]; then touch "$MARCA"; echo "✓ Renovación del SSL probada (dry-run)"
              else echo "$SALIDA" | tail -15; echo "✗ La renovación automática del SSL falla"; exit 1; fi
            fi

      - name: Subir dist/ al VPS
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/opt/centinela/dist"
          strip_components: 1

      - name: Verificar que el sitio responde
        if: github.event_name != 'pull_request'
        run: |
          sleep 5
          # La página principal y una dirección profunda (fallback de la SPA) devuelven el index nuevo
          JS=$(grep -o 'assets/index-[^"]*\.js' dist/index.html)
          for URL in https://clientes.telemet.com.ar/ https://clientes.telemet.com.ar/equipo/123; do
            curl -fsS -o /tmp/pagina.html "$URL"
            grep -q "$JS" /tmp/pagina.html || { echo "✗ $URL no sirve la versión nueva ($JS)"; exit 1; }
          done
          curl -fsS -o /dev/null "https://clientes.telemet.com.ar/$JS"
          curl -fsS -o /dev/null https://clientes.telemet.com.ar/manifest.json
          # App privada: no indexable (robots, cabecera y meta) y con las cabeceras de seguridad (ESTANDARES B7, C2)
          curl -fsS https://clientes.telemet.com.ar/robots.txt | grep -q "Disallow: /" || { echo "✗ robots.txt no bloquea"; exit 1; }
          CAB=$(curl -fsSI https://clientes.telemet.com.ar/equipo/123)
          for H in "x-robots-tag: noindex" "content-security-policy:" "strict-transport-security:" "x-content-type-options: nosniff"; do
            echo "$CAB" | grep -qi "$H" || { echo "✗ falta la cabecera $H"; exit 1; }
          done
          grep -q 'name="robots" content="noindex' dist/index.html || { echo "✗ falta la meta robots noindex"; exit 1; }
          echo "✓ Sitio responde OK con la versión nueva"
