name: Deploy Centinela

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Actualizar config en el VPS (docker-compose.yml, nginx.conf) y levantar servicios
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/centinela
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d

      - name: Subir dist/ al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/opt/centinela/dist"
          strip_components: 1

      - name: Verificar que el sitio responde
        run: |
          sleep 5
          curl -fsS -o /dev/null https://clientes.telemet.com.ar
          echo "✓ Sitio responde OK"
