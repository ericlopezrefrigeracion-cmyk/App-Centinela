name: Deploy Centinela

on:
  push:
    branches: [main]
  # En cada PR (los de Dependabot, por ejemplo) corren las verificaciones y los tests, sin desplegar.
  pull_request:

permissions:
  contents: read

concurrency:
  # Un PR no cancela un deploy en curso de main (cada rama tiene su grupo).
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Actualizar config en el VPS (docker-compose.yml, nginx.conf) y levantar servicios
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/centinela
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d

      - name: Subir dist/ al VPS
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/opt/centinela/dist"
          strip_components: 1

      - name: Verificar que el sitio responde
        if: github.event_name == 'push'
        run: |
          sleep 5
          curl -fsS -o /dev/null https://clientes.telemet.com.ar
          echo "✓ Sitio responde OK"
